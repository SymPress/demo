name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: sympress/workflows/.github/workflows/codeql.yml@2ebe47e2bc6d402c172015b64c0f5a9f2bf0c322 # v1.3.2
    with:
      languages: javascript-typescript
      build_mode: none
