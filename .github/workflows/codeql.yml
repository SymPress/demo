name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: sympress/workflows/.github/workflows/codeql.yml@4d668133403d357d8335fdbfb850bb13a9105ece # v2.0.0
    with:
      languages: javascript-typescript
      build_mode: none
