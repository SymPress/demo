name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    uses: sympress/workflows/.github/workflows/codeql.yml@177fa0d727b278d2103052ec77c102b4a4c492a0
    with:
      languages: javascript-typescript
      build_mode: none
