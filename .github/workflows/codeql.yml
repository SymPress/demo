name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: sympress/workflows/.github/workflows/codeql.yml@cd809f3986df3ea617d2d26bdf21ab69cae19c1e
    with:
      languages: javascript-typescript
      build_mode: none
