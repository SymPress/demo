name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: sympress/workflows/.github/workflows/codeql.yml@a044303b8492b0c6be48bd9c9fccdc36fb0a9794
    with:
      languages: javascript-typescript
      build_mode: none
