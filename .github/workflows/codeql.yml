name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: sympress/workflows/.github/workflows/codeql.yml@9ab936c5ff11667908252eb1b788fffe00ef5ed8
    with:
      languages: javascript-typescript
      build_mode: none
