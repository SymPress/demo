name: QA

on:
  schedule:
    - cron: '23 4 * * *'
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  website-ci:
    name: Website CI
    uses: sympress/workflows/.github/workflows/composer-validate.yml@v1
    with:
      php_version: '8.5'
      php_extensions: curl, dom, json, libxml, zip
      install: true
      audit: true
      validate_options: --strict --no-check-publish
      timeout_minutes: 12
    secrets:
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}

  root-qa:
    name: Root QA
    uses: sympress/workflows/.github/workflows/sympress-qa.yml@v1
    with:
      php_version: '8.5'
      php_extensions: curl, dom, json, libxml, zip
      node_version: '24'
      include_root: true
      package_glob: .
      run_validate: false
      run_audit: false
      run_phpcs: true
      run_phpstan: true
      run_phpunit: true
      run_node_build: true
      timeout_minutes: 15
    secrets:
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
      NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}

  vulnerability-gate:
    name: Wordfence vulnerability gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Check out SymPress Security
        uses: actions/checkout@v4
        with:
          repository: sympress/security
          path: security
          token: ${{ secrets.SYMPRESS_REPOSITORY_TOKEN || github.token }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, filter, json
          coverage: none

      - name: Install project
        working-directory: project
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH_JSON }}
        run: composer install --no-interaction --prefer-dist

      - name: Refresh Wordfence Intelligence cache
        working-directory: project
        env:
          WORDFENCE_INTELLIGENCE_API_KEY: ${{ secrets.WORDFENCE_INTELLIGENCE_API_KEY }}
        run: |
          test -n "$WORDFENCE_INTELLIGENCE_API_KEY"
          vendor/bin/sympress-security feed:update --provider=wordfence --output="${{ runner.temp }}/wordfence-v3.json"

      - name: Create JSON vulnerability report
        id: vulnerability-json
        continue-on-error: true
        working-directory: project
        run: vendor/bin/sympress-security vulnerability:check --project=. --feed="${{ runner.temp }}/wordfence-v3.json" --format=json > "${{ runner.temp }}/sympress-vulnerabilities.json"

      - name: Create SARIF vulnerability report
        if: always()
        continue-on-error: true
        working-directory: project
        run: vendor/bin/sympress-security vulnerability:check --project=. --feed="${{ runner.temp }}/wordfence-v3.json" --format=sarif > "${{ runner.temp }}/sympress-vulnerabilities.sarif"

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sympress-vulnerability-reports
          path: |
            ${{ runner.temp }}/sympress-vulnerabilities.json
            ${{ runner.temp }}/sympress-vulnerabilities.sarif

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/sympress-vulnerabilities.sarif

      - name: Enforce vulnerability gate
        if: steps.vulnerability-json.outcome == 'failure'
        run: exit 1
