name: QA

on:
  schedule:
    - cron: '23 4 * * *'
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  website-ci:
    name: Website CI
    uses: sympress/workflows/.github/workflows/composer-validate.yml@177fa0d727b278d2103052ec77c102b4a4c492a0
    with:
      php_version: '8.5'
      php_extensions: curl, dom, json, libxml, zip
      install: true
      audit: true
      validate_options: --strict --no-check-publish
      timeout_minutes: 12

  root-qa:
    name: Root QA
    uses: sympress/workflows/.github/workflows/ddev-playwright.yml@8639b193c127039573a9a907f811db7c3574c23e
    with:
      php_version: '8.5'
      node_version: '24'
      allow_custom_commands: true
      setup_command: |
        cp .env.example .env
        ddev composer install --no-interaction
        ddev composer runtime:setup --no-interaction
        ddev composer compile-assets --mode production
      playwright_install_command: ':'
      playwright_run_command: ddev composer qa
      timeout_minutes: 45

  operations-tests:
    name: Operations safety tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify backup, restore and monitoring controls
        run: python3 -m unittest discover -s dev-ops/tests -v
