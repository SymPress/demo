name: QA

on:
  schedule:
    - cron: '23 4 * * *'
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  website-ci:
    name: Website CI
    uses: sympress/workflows/.github/workflows/composer-validate.yml@b68ed03c15db6d2fac85d8345bc22a6229b4f4b2
    with:
      php_version: '8.5'
      php_extensions: curl, dom, json, libxml, zip
      install: true
      audit: true
      validate_options: --strict --no-check-publish
      timeout_minutes: 12
    secrets:
      SSH_KEY: ${{ secrets.COMPOSER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.COMPOSER_SSH_KNOWN_HOSTS }}
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}

  root-qa:
    name: Root QA
    uses: sympress/workflows/.github/workflows/ddev-playwright.yml@b68ed03c15db6d2fac85d8345bc22a6229b4f4b2
    with:
      php_version: '8.5'
      node_version: '24'
      allow_custom_commands: true
      setup_command: |
        cp .env.example .env
        ddev composer install --no-interaction
        ddev composer runtime:setup --no-interaction
        ddev composer compile-assets --mode production
      playwright_install_command: ':'
      playwright_run_command: ddev composer qa
      timeout_minutes: 45
    secrets:
      SSH_KEY: ${{ secrets.COMPOSER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.COMPOSER_SSH_KNOWN_HOSTS }}
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}

  operations-tests:
    name: Operations safety tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Verify backup, restore and monitoring controls
        run: python3 -m unittest discover -s dev-ops/tests -v
