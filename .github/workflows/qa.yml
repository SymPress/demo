name: QA

on:
  schedule:
    - cron: '23 4 * * *'
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-ci:
    name: Website CI
    uses: sympress/workflows/.github/workflows/composer-validate.yml@cd809f3986df3ea617d2d26bdf21ab69cae19c1e
    with:
      php_version: '8.5'
      php_extensions: curl, dom, json, libxml, zip
      install: true
      audit: true
      validate_options: --strict --no-check-publish
      timeout_minutes: 12

  root-qa:
    name: Root QA
    uses: sympress/workflows/.github/workflows/ddev-playwright.yml@cd809f3986df3ea617d2d26bdf21ab69cae19c1e
    with:
      php_version: '8.5'
      node_version: '24'
      allow_custom_commands: true
      setup_command: |
        set -euo pipefail
        cp .env.example .env
        ddev exec php dev-ops/prepare-env.php
        ddev composer install --no-interaction
        ddev composer runtime:setup --no-interaction
        ddev composer compile-assets --mode production
      playwright_install_command: ':'
      playwright_run_command: ddev composer qa
      timeout_minutes: 45

  operations-tests:
    name: Operations safety tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up native PHP test environment
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: curl, dom, mbstring, opcache, xml, zip
          tools: composer:2.10.3
          coverage: none
      - name: Install native operation fixtures
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y software-properties-common
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php8.5-fpm libfcgi-bin nginx
          composer install --no-plugins --no-scripts --prefer-dist --no-interaction --no-progress
          composer install --working-dir=deployment --no-plugins --no-scripts --prefer-dist --no-interaction --no-progress
      - name: Verify backup, restore and monitoring controls
        run: |
          python3 - <<'PY'
          import unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('dev-ops/tests'))
          if result.skipped:
              raise SystemExit('Native operation fixtures must run without skipped tests.')
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
