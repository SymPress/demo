name: DDEV Canary

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:
    inputs:
      update_dependencies:
        description: Exercise the fresh stable dependency update path
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ddev-canary:
    name: DDEV + Playwright
    uses: sympress/workflows/.github/workflows/ddev-playwright.yml@8639b193c127039573a9a907f811db7c3574c23e
    with:
      php_version: '8.5'
      node_version: '24'
      allow_custom_commands: true
      setup_command: |
        set -euo pipefail
        cp .env.example .env
        canary_mode="$(bash .github/scripts/canary-mode.sh)"
        if [ "$canary_mode" = "update" ]; then
          ddev composer update --with-all-dependencies --no-interaction --no-scripts
        fi
        ddev composer install --no-interaction
        ddev composer runtime:setup --no-interaction
        ddev composer compile-assets --mode production
      playwright_install_command: ddev exec bash -lc "cd packages/sympress-demo && npm ci" && cd packages/sympress-demo && npx playwright install --with-deps chromium
      playwright_run_command: ddev composer qa && cd packages/sympress-demo && npx playwright test
      playwright_artifact_name: sympress-demo-playwright
      playwright_artifact_path: |
        composer.lock
        packages/sympress-demo/playwright-report/
        packages/sympress-demo/test-results/
      timeout_minutes: 45
    secrets:
      SSH_KEY: ${{ secrets.COMPOSER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.COMPOSER_SSH_KNOWN_HOSTS }}
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
