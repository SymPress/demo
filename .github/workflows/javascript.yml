name: JavaScript

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    uses: sympress/workflows/.github/workflows/javascript-static-analysis.yml@d38b2d9e40eb5b0cdcb84102761af748e3d155b8
    with:
      node_version: '24'
      working_directory: packages/sympress-demo
      script: typecheck

  npm-audit:
    name: npm audit
    uses: sympress/workflows/.github/workflows/javascript-static-analysis.yml@d38b2d9e40eb5b0cdcb84102761af748e3d155b8
    with:
      node_version: '24'
      working_directory: packages/sympress-demo
      script: audit

  production-build:
    name: Production build
    uses: sympress/workflows/.github/workflows/javascript-static-analysis.yml@d38b2d9e40eb5b0cdcb84102761af748e3d155b8
    with:
      node_version: '24'
      working_directory: packages/sympress-demo
      script: build:production
