name: JavaScript

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    uses: sympress/workflows/.github/workflows/javascript-static-analysis.yml@0c311d7c8fff9352a1cae5819cf2615b08aa1934
    with:
      node_version: '24'
      working_directory: packages/sympress-demo
      script: typecheck

  npm-audit:
    name: npm audit
    uses: sympress/workflows/.github/workflows/javascript-static-analysis.yml@0c311d7c8fff9352a1cae5819cf2615b08aa1934
    with:
      node_version: '24'
      working_directory: packages/sympress-demo
      script: audit

  production-build:
    name: Production build
    uses: sympress/workflows/.github/workflows/javascript-static-analysis.yml@0c311d7c8fff9352a1cae5819cf2615b08aa1934
    with:
      node_version: '24'
      working_directory: packages/sympress-demo
      script: build:production
