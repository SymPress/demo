name: JavaScript

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    uses: sympress/workflows/.github/workflows/javascript-static-analysis.yml@2ebe47e2bc6d402c172015b64c0f5a9f2bf0c322 # v1.3.2
    with:
      node_version: '24'
      working_directory: packages/sympress-demo
      script: typecheck

  npm-audit:
    name: npm audit
    uses: sympress/workflows/.github/workflows/javascript-static-analysis.yml@2ebe47e2bc6d402c172015b64c0f5a9f2bf0c322 # v1.3.2
    with:
      node_version: '24'
      working_directory: packages/sympress-demo
      script: audit

  production-build:
    name: Production build
    uses: sympress/workflows/.github/workflows/javascript-static-analysis.yml@2ebe47e2bc6d402c172015b64c0f5a9f2bf0c322 # v1.3.2
    with:
      node_version: '24'
      working_directory: packages/sympress-demo
      script: build:production
